# Claymod enrollment simulation: real token -> HTTPS bootstrap -> enroll -> probe.
#
#   docker compose -f simulation/docker-compose.yml up --build --exit-code-from control
#
# `control` runs claymod serve (HTTPS bootstrap, fake WG backend) and
# issues a one-time token; `host` enrolls against it with the real
# enrollment flow and runs the agent; `probes` drives the full positive +
# negative TLS suite against the *enrolled* agent identity.
name: claymod-sim

services:
  control:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    entrypoint: ["sh", "/scripts/control-entry.sh"]
    environment:
      SERVER_NAME: "control"
      HOSTNAME_FOR_TOKEN: "agent"
    volumes:
      - shared:/shared
      - ./scripts:/scripts:ro

  agent:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    entrypoint: ["sh", "/scripts/enroll-entry.sh"]
    environment:
      CONTROL_URL: "https://control:8443"
      HOSTNAME_FOR_TOKEN: "agent"
      CLAYMOD_SCHEMA_DIR: "/pkl"
    volumes:
      - shared:/shared
      - ./scripts:/scripts:ro
      - ../pkl:/pkl:ro
    depends_on:
      control:
        condition: service_started

  probes:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    entrypoint: ["sh", "/scripts/probes.sh"]
    environment:
      AGENT_ADDR: "agent:2323"
      SERVER_NAME: "agent"
    volumes:
      - shared:/shared
      - ./scripts:/scripts:ro
      - ../pkl:/pkl:ro
    depends_on:
      agent:
        # service_started is enough: probes.sh waits for the fixtures and
        # for the enrolled agent to accept connections (bounded).
        condition: service_started

volumes:
  shared:
