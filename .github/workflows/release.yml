name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.binary.name }} linux/${{ matrix.platform.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # goarch is Go's name (GOARCH=arm64); arch is the uname(1) name
        # used in asset names and /agent/<os>/<arch> (aarch64).
        platform:
          - { goarch: amd64, arch: amd64 }
          - { goarch: arm64, arch: aarch64 }
        binary:
          - name: claymod
            ldvar: github.com/claymod/claymod/internal/cli.version
          - name: claymod-agent
            ldvar: main.version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.platform.goarch }}
        run: |
          out="${{ matrix.binary.name }}-linux-${{ matrix.platform.arch }}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X ${{ matrix.binary.ldvar }}=${GITHUB_REF_NAME}" \
            -o "dist/${out}" "./cmd/${{ matrix.binary.name }}"
          ls -l dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary.name }}-linux-${{ matrix.platform.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum claymod-linux-* claymod-agent-linux-* | tee SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
